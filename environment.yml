name: emit-pics
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - scipy
  - xarray
  - netCDF4
  - h5netcdf
  - geopandas
  - shapely
  - pyproj
  - matplotlib
  - cartopy
  - contextily
  # --- Landsat 9 control branch (formerly the separate `ls9-draft` env) ---
  # conda-forge so they share the same GDAL/PROJ build as geopandas/cartopy/pyproj
  - rasterio
  - pystac-client
  - boto3
  # --- OLI-2 RSR workbook reader (scripts/build_oli2_rsr_tidy.py) ---
  - openpyxl
  - pyyaml
  - jupyter
  - jupyterlab
  - pytest
  - pip
  - pip:
    - earthaccess
