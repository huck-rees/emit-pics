name: emit-pics
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - scipy
  - xarray
  - netCDF4
  - h5netcdf
  - geopandas
  - shapely
  - pyproj
  - matplotlib
  - cartopy
  - contextily
  # --- Landsat 9 control branch (formerly the separate `ls9-draft` env) ---
  # conda-forge so they share the same GDAL/PROJ build as geopandas/cartopy/pyproj
  - rasterio
  - pystac-client
  - boto3
  # --- OLI-2 RSR workbook reader (scripts/build_oli2_rsr_tidy.py) ---
  - openpyxl
  # NASA Earthdata access. conda-forge (not pip) so its AWS/async stack
  # (s3fs/aiobotocore/botocore) co-solves with boto3 instead of pip
  # downgrading botocore out from under the conda boto3.
  - earthaccess
  - pyyaml
  - jupyter
  - jupyterlab
  - pytest
