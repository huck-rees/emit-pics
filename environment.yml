name: emit-pics
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - scipy
  - xarray
  - netCDF4
  - rasterio
  - geopandas
  - shapely
  - matplotlib
  - pyyaml
  - jupyter
  - jupyterlab
  - rioxarray
  - h5netcdf
  - spectral
  - contextily        # satellite basemap tiles for the coverage-map figure
  - cartopy           # locator map (coastlines/borders/graticule) for the study-overview figure
  - pytest
  - pip
  - pip:
    - earthaccess