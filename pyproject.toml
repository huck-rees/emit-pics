# Project + tooling configuration.
#
# The [project] table makes `emit_pics` a pip-installable package. Install it
# once into the conda env in editable mode:
#
#     pip install -e . --no-deps
#
# `--no-deps` keeps pip from pulling PyPI copies of the geospatial stack that
# conda already provides (see environment.yml, the supported install path).
# After this, `import emit_pics` works from anywhere — notebooks, tests, and the
# scripts — so the per-script sys.path boilerplate is no longer needed.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emit-pics"
version = "0.1.0"
description = "Radiometric temporal-stability analysis of NASA EMIT over North African PICS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "xarray",
    "netCDF4",
    "h5netcdf",
    "geopandas",
    "shapely",
    "pyproj",
    "matplotlib",
    "cartopy",
    "contextily",
    "pyyaml",
    "earthaccess",
]

[project.optional-dependencies]
dev = ["pytest"]

# Only the library is a package; scripts/ and tests/ are not installed.
[tool.setuptools]
packages = ["emit_pics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
