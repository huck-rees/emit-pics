# Pseudo-Invariant Calibration Sites (PICS) for EMIT temporal stability analysis.
#
# This file is the SINGLE SOURCE OF TRUTH for PICS site geometry. Each site's
# region of interest is an axis-aligned bounding box in EPSG:4326 (decimal
# degrees), given by `bbox: {min_lon, min_lat, max_lon, max_lat}`. The pipeline
# builds the site rectangle directly from those four numbers
# (`emit_pics.config.pics_polygon`) and can regenerate the companion
# `northafrican_pics.gpkg` from this file (`scripts/run_export_pics_gpkg.py`),
# so no external GeoPackage seed is required.
#
# Values below are the CEOS/CNES reference boxes (source URLs per site).
# `center_lat/lon`, `altitude_m`, `utm_zone`, `wrs2_path_row`, and
# `usable_area_km` are carried as metadata; the bbox is what drives the analysis.

sites:
  libya_4:
    site_name: "Libya 4"
    country: "Libya"
    roi_type: "CEOS"
    center_lat: 28.55
    center_lon: 23.39      # official CEOS/CNES value; the 23.99 variant is an outlier — do NOT use
    wrs2_path_row: "181/40"
    utm_zone: 34
    altitude_m: 118        # cross-checkable against EMIT's elevation layer as a location sanity check
    usable_area_km: "75 x 75"
    bbox: { min_lon: 22.89, min_lat: 28.05, max_lon: 23.89, max_lat: 29.05 }
    source: "https://calval.cr.usgs.gov/apps/libya-4"

  algeria_3:
