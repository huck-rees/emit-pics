# EMIT-PICS run configuration — the ONE place to set the analysis target.
#
# Edit this file, then run the scripts (or scripts/run_pipeline.py). It replaces
# the per-script "USER-CONFIGURABLE INPUTS" blocks. `site` accepts any spelling
# (libya_4 / "Libya 4" / Libya_4); it is resolved to the canonical filename token.

# --- analysis target (required) ---
site: Libya_1          # PICS site (any spelling)
patch: "10_7_1"        # patch_id for the single-patch steps
patch_size: "10"       # patch-size token (km) for the batched (all-patches) steps

# --- EMIT product short names ---
products:
  rad_short_name: EMITL1BRAD
  rfl_short_name: EMITL2ARFL

# --- matched-pair tolerances (degrees) ---
matching:
  sza_tol: 2.0
  vza_tol: 5.0

# --- manual QC gate ---
qc:
  require_review: true   # downstream steps refuse until the QC worksheet is reviewed

# --- spectra plots ---
spectra:
  stat: median           # "median" or "mean"

# --- radiometry ---
radiometry:
  # Divide L1B radiance by the Earth–Sun eccentricity factor E0 at read time,
  # bringing every scene to 1 AU (L2A reflectance already is). Removes the
  # seasonal ~±3.4% 1/d² solar-flux leak from the radiance drift.
  earth_sun_normalize: true
  # E0 provider: "spencer" (closed-form Spencer 1971 / Iqbal 1983) or "table"
  # (ephemeris lookup from config/earth_sun_distance.txt). Agree to <0.1%.
  e0_method: spencer

# --- cross-PICS drift analysis ---
drift:
  alpha: 0.05            # per-channel significance level (uncorrected p-value)
  use_aggregated: true   # fit the option-A aggregated tables (vs raw per-patch)
  individual_channels: true
  # One representative patch per PICS for the ORIGINAL cross-PICS pool used by the
  # publication per-channel figure. Only needed to disambiguate a PICS whose
  # per_patch/ folder also holds the parallel all-patches experiment's tables
  # (a PICS with a single patch is picked automatically). The configured `site`
  # is pinned to `patch` above automatically.
  # cross_pics_patches:
  #   Libya_4: "10_7_1"
  #   Algeria_3: "10_3_2"

# --- BRDF / quasi-BRDF pooled multi-site drift ---
# Pooled multi-site drift: every PICS contributes ONE representative patch (one
# patch = one "site"), all sites share a single drift rate gamma while each keeps
# its own brightness/BRDF terms. Ignores the single/allpatches mode fork.
brdf:
  site_patches:            # one representative patch per PICS; null = skip that site
    Libya_4: "10_7_1"
    Algeria_3: null
    Algeria_5: null
    Libya_1: null
    Mauritania_1: null
  exclude_sites: [Mauritania_2]   # dropped by design (too few QC-surviving scenes)
  target_wl: 858.0         # nm; nearest channel is used for the single-channel fit
  min_scenes: 4            # per-site post-QC floor; sites below are dropped
  n_bootstrap: 1000        # resamples for the pooled shared-gamma CI
  per_site_boot: 500       # resamples for each site's standalone-gamma CI (§4b)
  spectrum_n_boot: 300     # per-channel resamples for the gamma(lambda) spectrum (§8)
  gamma_cap: 500.0         # %/yr; |gamma| or CI half-width beyond this = degenerate fit

# --- pixel extraction ---
extract:
  cache_pixels: true
  want_obs: true
  filter_agg_flag: false
  min_valid_frac: 0.60

# --- Earthdata granule search (upstream, step 2) ---
granule_search:
  date_start: "2022-08-01"
  date_end: "2026-06-30"
  patch_size_km: 10

# --- patch generation (upstream, step 1) ---
patch_gen:
  min_patch_km: 10
  increment_km: 10
